name: Update Fire Truck Data

on:
  schedule:
    - cron: '*/5 * * * *'  # Run every 5 minutes (minimum interval allowed by GitHub Actions)
                           # Note: GitHub may still delay or skip runs during high load periods
  workflow_dispatch:     # Allow manual trigger
  repository_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Need write permission to update the cached file
    
    steps:
      - name: Checkout code branch
        uses: actions/checkout@v3
        with:
          ref: code
          fetch-depth: 0  # Fetch all history so we can access other branches

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Test API connectivity
        id: test-api
        run: npm test
        continue-on-error: true

      - name: Checkout data branch for data directory
        run: |
          git fetch origin data
          git checkout origin/data -- data/ || mkdir -p data

      - name: Fetch and process API data
        run: npm start
        env:
          TEST_STATUS: ${{ steps.test-api.outcome == 'success' && 'OK' || 'NOT OK' }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Commit and push changes
        run: |
          # Get today's date in YYYYMMDD format
          TODAY=$(date '+%Y%m%d')
          GPX_FILE="data/goa-fire-trucks-gpx-${TODAY}.geojson"
          CSV_FILE="data/csv/goa-fire-trucks-${TODAY}.csv"
          COVERAGE_FILE="data/coverage.csv"

          # First check if any files changed
          if git status -s | grep -q "data/"; then
            # Switch to data branch
            git fetch origin data
            git checkout -B data origin/data

            # Copy the updated data files from our working directory
            git checkout code -- data/

            # Add both the main data file and the daily GPX track file
            git add data/goa-fire-trucks.geojson "$GPX_FILE" "$CSV_FILE" "$COVERAGE_FILE"

            # Commit and push the changes
            git commit -m "Refresh fire truck data and track history [skip ci]"
            git push origin data
          else
            echo "No changes detected in data files"
          fi

      - name: Verify data branch update with API test
        if: success()
        run: |
          # Switch back to code branch to run test
          git checkout -B code origin/code
          npm test
