name: Update Fire Truck Data

on:
  schedule:
    - cron: '*/5 * * * *'  # Run every 5 minutes (minimum interval allowed by GitHub Actions)
                           # Note: GitHub may still delay or skip runs during high load periods
  workflow_dispatch:     # Allow manual trigger
  repository_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Need write permission to update the cached file
    
    steps:
      - name: Checkout code branch
        uses: actions/checkout@v3
        with:
          ref: code
          fetch-depth: 0  # Fetch all history so we can access other branches

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Test API connectivity
        id: test-api
        run: npm test
        continue-on-error: true

      - name: Wait for API rate limit reset
        run: sleep 30

      - name: Checkout data branch for data directory
        run: |
          git fetch origin data
          git checkout origin/data -- data/ || mkdir -p data

      - name: Fetch and process API data
        run: npm start
        env:
          TEST_STATUS: ${{ steps.test-api.outcome == 'success' && 'OK' || 'NOT OK' }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Commit and push changes
        id: commit-data
        run: |
          # Get today's date in YYYYMMDD format
          TODAY=$(date '+%Y%m%d')
          GPX_FILE="data/goa-fire-trucks-gpx-${TODAY}.geojson"
          CSV_FILE="data/csv/goa-fire-trucks-${TODAY}.csv"
          COVERAGE_FILE="data/coverage.csv"

          # First check if any files changed
          if git status -s | grep -q "data/"; then
            # IMPORTANT: Save the generated data files before switching branches
            # The checkout will discard uncommitted changes, so we need to preserve them
            mkdir -p /tmp/data-backup/csv
            cp -r data/* /tmp/data-backup/

            # Switch to data branch
            git fetch origin data
            git checkout -B data origin/data

            # Restore the generated data files
            cp -r /tmp/data-backup/* data/

            # Add both the main data file and the daily GPX track file
            git add data/goa-fire-trucks.geojson "$GPX_FILE" "$CSV_FILE" "$COVERAGE_FILE"

            # Commit and push the changes
            git commit -m "Refresh fire truck data and track history [skip ci]"
            git push origin data

            # Capture the commit SHA for status reporting
            COMMIT_SHA=$(git rev-parse HEAD)
            echo "data_commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
            echo "changes_pushed=true" >> $GITHUB_OUTPUT
          else
            echo "No changes detected in data files"
            echo "changes_pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify data branch update with API test
        id: verify-test
        if: success()
        run: |
          # Switch back to code branch to run test
          git checkout -B code origin/code
          npm test

      - name: Report success status to data branch
        if: success() && steps.commit-data.outputs.changes_pushed == 'true'
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ steps.commit-data.outputs.data_commit_sha }} \
            -d '{
              "state": "success",
              "target_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "description": "API tests passed and data updated successfully",
              "context": "ci/data-update"
            }'

      - name: Report failure status to data branch
        if: failure() && steps.commit-data.outputs.changes_pushed == 'true'
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ steps.commit-data.outputs.data_commit_sha }} \
            -d '{
              "state": "failure",
              "target_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "description": "API tests or data update failed",
              "context": "ci/data-update"
            }'
