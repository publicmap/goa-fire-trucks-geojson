<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Fire Truck Movement Replay</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Slider container to hold input and ticks */
        .slider-container {
            flex-grow: 1;
            position: relative;
            height: 20px;
            display: flex;
            align-items: center;
        }

        #slider {
            width: 100%;
            margin: 0;
            position: relative;
            z-index: 2;
            /* Above ticks */
            background: transparent;
        }

        /* Ticks styling */
        .ticks-container {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 20px;
            /* Height of ticks */
            pointer-events: none;
            z-index: 1;
        }

        .tick {
            position: absolute;
            width: 2px;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.2);
            top: 0;
        }

        #time-display {
            font-size: 1.2em;
            font-weight: bold;
            min-width: 150px;
            text-align: center;
        }

        button {
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }

        button:hover {
            background: #0056b3;
        }

        .vehicle-popup {
            max-width: 200px;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <div id="controls">
        <div class="control-row">
            <button id="play-pause">Play</button>
            <div id="time-display">--:--:--</div>
            <div class="slider-container">
                <div id="ticks-container" class="ticks-container"></div>
                <input type="range" id="slider" min="0" max="100" value="0" step="1">
            </div>
        </div>
        <div style="font-size: 0.9em; color: #666; text-align: center;">
            Fire Truck Movement Replay • <span id="date-display">...</span> (IST)
        </div>
    </div>

    <script src="https://d3js.org/d3-dsv.v3.min.js"></script>
    <script>

        mapboxgl.accessToken = 'pk.eyJ1IjoicGxhbmVtYWQiLCJhIjoiY2l3ZmNjNXVzMDAzZzJ0cDV6b2lkOG9odSJ9.eep6sUoBS0eMN4thZUWpyQ';

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/streets-v12', // Standard style
            center: [74.0, 15.4], // Goa center roughly
            zoom: 9
        });

        let animationData = null;
        let isPlaying = false;
        let animationFrameId = null;
        let lastTimestamp = 0;
        const speedFactor = 1000; // 1s real time = 1000s sim time (approx) - will adjust

        // UI Elements
        const controlsDiv = document.getElementById('controls');
        // Inject Date Selector and View Data Button
        const dateControlRow = document.createElement('div');
        dateControlRow.className = 'control-row';
        dateControlRow.style.marginBottom = '10px';
        dateControlRow.style.justifyContent = 'center';
        dateControlRow.innerHTML = `
            <select id="date-selector" style="padding: 8px; font-size: 1em; border-radius: 4px; border: 1px solid #ccc;">
                <option value="">Loading dates...</option>
            </select>
            <button id="view-data-btn">View Data</button>
        `;
        controlsDiv.insertBefore(dateControlRow, controlsDiv.firstChild);

        const dateSelector = document.getElementById('date-selector');
        const viewDataBtn = document.getElementById('view-data-btn');
        const slider = document.getElementById('slider');
        const timeDisplay = document.getElementById('time-display');
        const dateDisplay = document.getElementById('date-display');
        const playBtn = document.getElementById('play-pause');
        const ticksContainer = document.getElementById('ticks-container');

        let vehiclePaths = new Map(); // Store full path history for each vehicle
        let availableFiles = [];

        map.on('load', () => {
            loadCoverageMetadata();
        });

        function loadCoverageMetadata() {
            fetch('https://raw.githubusercontent.com/publicmap/goa-fire-trucks-geojson/refs/heads/data/data/coverage.csv')
                .then(response => {
                    if (!response.ok) throw new Error("Coverage file not found");
                    return response.text();
                })
                .then(text => {
                    const data = d3.csvParse(text);
                    availableFiles = data;
                    populateDateSelector(data);

                    // Automatically load the latest available data if exists
                    if (data.length > 0) {
                        dateSelector.selectedIndex = 0;
                        loadDailyData();
                    }
                })
                .catch(err => {
                    console.error('Error loading coverage metadata:', err);
                    dateSelector.innerHTML = '<option value="">Error loading dates</option>';
                });
        }

        function populateDateSelector(data) {
            dateSelector.innerHTML = '';

            // Filter only valid status if needed, or show all with indicators
            // data has: Date, Filename, Updated_At, Status

            data.forEach(row => {
                const option = document.createElement('option');
                option.value = row.Filename;
                const statusIndicator = row.Status === 'OK' ? '✓' : (row.Status === 'NOT OK' ? '✗' : '?');
                option.textContent = `${row.Date} (${statusIndicator})`;
                dateSelector.appendChild(option);
            });

            if (data.length === 0) {
                const option = document.createElement('option');
                option.textContent = "No data available";
                dateSelector.appendChild(option);
            }
        }

        viewDataBtn.addEventListener('click', loadDailyData);

        function loadDailyData() {
            const filename = dateSelector.value;
            if (!filename) return;

            // Stop any current animation
            if (isPlaying) togglePlay();

            fetch(`https://raw.githubusercontent.com/publicmap/goa-fire-trucks-geojson/refs/heads/data/data/csv/${filename}`)
                .then(response => {
                    if (!response.ok) throw new Error(`Data file ${filename} not found`);
                    return response.text();
                })
                .then(text => {
                    const rawData = d3.csvParse(text);
                    processCsvToAnimationData(rawData);
                })
                .catch(err => console.error('Error loading daily data:', err));
        }

        function processCsvToAnimationData(rawData) {
            // rawData: [{Timestamp, Vehicle_No, Latitude, Longitude, ...}, ...]

            // Group by Timestamp
            const stepsMap = new Map();

            rawData.forEach(row => {
                const time = new Date(row.Timestamp + '+05:30').getTime();
                if (isNaN(time)) return;

                if (!stepsMap.has(time)) {
                    stepsMap.set(time, []);
                }

                // Convert row to vehicle object
                stepsMap.get(time).push({
                    id: row.Vehicle_No,
                    lat: parseFloat(row.Latitude),
                    lon: parseFloat(row.Longitude),
                    status: row.Status,
                    branch: row.Branch
                });
            });

            // Convert to sorted array
            const sortedTimes = Array.from(stepsMap.keys()).sort((a, b) => a - b);

            const steps = sortedTimes.map(time => ({
                time: time,
                vehicles: stepsMap.get(time)
            }));

            animationData = {
                steps: steps,
                date: dateSelector.options[dateSelector.selectedIndex]?.text.split(' ')[0] || 'Unknown'
            };

            preprocessPaths();
            initAnimation();
        }

        function preprocessPaths() {
            if (!animationData || !animationData.steps) return;
            vehiclePaths.clear();

            // Iterate through all steps to build history
            for (const step of animationData.steps) {
                for (const v of step.vehicles) {
                    if (!vehiclePaths.has(v.id)) {
                        vehiclePaths.set(v.id, []);
                    }
                    vehiclePaths.get(v.id).push({
                        time: step.time,
                        lat: v.lat,
                        lon: v.lon
                    });
                }
            }
            console.log(`Preprocessed paths for ${vehiclePaths.size} vehicles`);
        }

        function initAnimation() {
            if (!animationData || !animationData.steps || animationData.steps.length === 0) {
                alert("No valid data points found for this date.");
                return;
            }

            dateDisplay.textContent = animationData.date;

            const steps = animationData.steps;
            const startTime = steps[0].time;
            const endTime = steps[steps.length - 1].time;

            console.log(`Animation range: ${new Date(startTime).toLocaleTimeString()} to ${new Date(endTime).toLocaleTimeString()}`);

            // Setup slider
            slider.min = startTime;
            slider.max = endTime;
            slider.value = startTime;
            // slider.step = 1000; // 1 second steps - keep it simple, maybe smaller?
            slider.step = 1000;

            // Generate ticks for data points
            ticksContainer.innerHTML = '';
            const duration = endTime - startTime;
            if (duration > 0) {
                // Limit ticks if too many steps
                const stepSkip = Math.ceil(steps.length / 50);
                steps.forEach((step, idx) => {
                    if (idx % stepSkip !== 0) return;
                    const pct = ((step.time - startTime) / duration) * 100;
                    const tick = document.createElement('div');
                    tick.className = 'tick';
                    tick.style.left = `${pct}%`;
                    ticksContainer.appendChild(tick);
                });
            }

            // Remove existing layers/sources if re-initializing
            if (map.getSource('vehicles')) {
                // If layers exist, they will use the updated source data?
                // No, source.setData is for geojson. 
                // We don't need to remove layers, just update source.
                // But initAnimation adds layers. Let's check if they exist.
                if (!map.getLayer('vehicles-trail')) {
                    // Add source if not exists
                }
                // Actually safer to just update data if initialized
                updateMap(startTime);
                return;
            }

            // Add source
            map.addSource('vehicles', {
                type: 'geojson',
                data: getGeoJSONForTime(startTime)
            });

            // Add trail layer (LineString) - UNDER points
            map.addLayer({
                id: 'vehicles-trail',
                type: 'line',
                source: 'vehicles',
                filter: ['==', ['get', 'type'], 'trail'],
                paint: {
                    'line-color': '#007cbf',
                    'line-width': 2,
                    'line-opacity': 0.5
                }
            });

            // Add point layer
            map.addLayer({
                id: 'vehicles-point',
                type: 'circle',
                source: 'vehicles',
                filter: ['==', ['get', 'type'], 'vehicle'],
                paint: {
                    'circle-radius': 3,
                    'circle-color': [
                        'match',
                        ['get', 'status'],
                        'active', 'red',
                        'inactive', '#aaa',
                        'grey' // default
                    ],
                    'circle-stroke-width': 2,
                    'circle-stroke-color': '#fff'
                }
            });

            // Add labels
            map.addLayer({
                id: 'vehicles-label',
                type: 'symbol',
                source: 'vehicles',
                filter: ['==', ['get', 'type'], 'vehicle'],
                layout: {
                    'text-field': ['get', 'id'],
                    'text-font': ['Open Sans Semibold', 'Arial Unicode MS Bold'],
                    'text-offset': [0, 0.2],
                    'text-anchor': 'top',
                    'text-size': 8
                },
                paint: {
                    'text-color': 'red',
                    'text-halo-color': '#fff',
                    'text-halo-width': 2
                }
            });

            // Update initial time
            updateTimeDisplay(startTime);

            // Fit bounds
            const bounds = new mapboxgl.LngLatBounds();
            steps.forEach(step => {
                step.vehicles.forEach(v => {
                    bounds.extend([v.lon, v.lat]);
                });
            });
            if (!bounds.isEmpty()) {
                map.fitBounds(bounds, { padding: 50 });
            }

            // Event listeners
            slider.addEventListener('input', (e) => {
                const t = parseInt(e.target.value);
                updateMap(t);
            });

            playBtn.addEventListener('click', togglePlay);
        }

        function getGeoJSONForTime(timestamp) {
            if (!animationData) return { type: 'FeatureCollection', features: [] };

            const steps = animationData.steps;

            let idx = steps.findIndex(s => s.time > timestamp);
            if (idx === -1) idx = steps.length;

            // Safety check for idx range
            const nextStep = idx < steps.length ? steps[idx] : null;
            const prevStep = idx > 0 ? steps[idx - 1] : null;

            let activeVehicles = [];

            // Case 1: Before first step
            if (!prevStep) {
                // activeVehicles = steps[0].vehicles;
                // Don't show anything before start? Or show start?
                if (steps.length > 0) activeVehicles = steps[0].vehicles;
            }
            // Case 2: After last step
            else if (!nextStep) {
                activeVehicles = prevStep.vehicles;
            }
            // Case 3: Interpolating
            else {
                const progress = (timestamp - prevStep.time) / (nextStep.time - prevStep.time);

                const vehicleMap = new Map();
                prevStep.vehicles.forEach(v => vehicleMap.set(v.id, { ...v }));

                nextStep.vehicles.forEach(nextV => {
                    const prevV = vehicleMap.get(nextV.id);
                    if (prevV) {
                        // Interpolate
                        const lat = prevV.lat + (nextV.lat - prevV.lat) * progress;
                        const lon = prevV.lon + (nextV.lon - prevV.lon) * progress;
                        activeVehicles.push({
                            ...nextV,
                            lat,
                            lon
                        });
                    } else {
                        // Vehicle newly appeared
                        activeVehicles.push(nextV);
                    }
                });
            }

            // Create Features: Points + Trails
            const features = [];

            activeVehicles.forEach(v => {
                // Point Feature
                features.push({
                    type: 'Feature',
                    geometry: {
                        type: 'Point', // Ensure Point (singular)
                        coordinates: [v.lon, v.lat]
                    },
                    properties: {
                        type: 'vehicle', // Distinction for filter
                        id: v.id,
                        name: v.name,
                        status: v.status,
                        branch: v.branch
                    }
                });

                // Trail Feature
                const path = vehiclePaths.get(v.id);
                if (path) {
                    // Get all historical points <= current timestamp
                    // Optimization: binary search or assumes sorted? It is sorted.
                    // Just filtering might be slow if many points. 
                    // Since it's sorted by time, we can just slice? 
                    // path is array of {time, lat, lon}

                    // Simple filter for now
                    const history = [];
                    for (let i = 0; i < path.length; i++) {
                        if (path[i].time <= timestamp) {
                            history.push([path[i].lon, path[i].lat]);
                        } else {
                            break; // Sorted
                        }
                    }

                    // Always add the current (interpolated) position as the last point to connect smoothly
                    history.push([v.lon, v.lat]);

                    if (history.length > 1) {
                        features.push({
                            type: 'Feature',
                            geometry: {
                                type: 'LineString',
                                coordinates: history
                            },
                            properties: {
                                type: 'trail',
                                id: v.id
                            }
                        });
                    }
                }
            });

            return {
                type: 'FeatureCollection',
                features: features
            };
        }

        function updateMap(timestamp) {
            updateTimeDisplay(timestamp);
            const geojson = getGeoJSONForTime(timestamp);
            const source = map.getSource('vehicles');
            if (source) {
                source.setData(geojson);
            }
        }

        function updateTimeDisplay(timestamp) {
            const date = new Date(timestamp);
            // Convert to IST
            timeDisplay.textContent = date.toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour12: false });
        }

        function togglePlay() {
            if (!animationData) return;
            isPlaying = !isPlaying;
            playBtn.textContent = isPlaying ? 'Pause' : 'Play';
            if (isPlaying) {
                lastTimestamp = performance.now();
                requestAnimationFrame(animate);
            }
        }

        function animate(now) {
            if (!isPlaying) return;

            // Speed: 
            // 900 * 1000 => 1 real sec = 900s sim time (15 mins) - seems nice for day view
            // const speed = 900 * 1000; 
            const speed = 200 * 1000; // Slower: 1 real sec = 200s (3.3 mins)

            const dt = (now - lastTimestamp) / 1000; // delta in seconds
            lastTimestamp = now;

            let currentTime = parseInt(slider.value);
            currentTime += dt * speed;

            if (currentTime > parseInt(slider.max)) {
                currentTime = parseInt(slider.min); // Loop
                // isPlaying = false;
                // playBtn.textContent = 'Play';
                // return;
            }

            slider.value = currentTime;
            updateMap(currentTime);

            animationFrameId = requestAnimationFrame(animate);
        }
    </script>
</body>

</html>
